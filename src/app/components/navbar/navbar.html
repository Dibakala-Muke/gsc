<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-ink-100 shadow-sm fixed">
    <input type="checkbox" id="nav-toggle" class="hidden peer" />
    <nav class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

      <!-- Logo -->
      <a [routerLink]="['/home']" class="flex items-center gap-3 group">
        <div class="relative">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-ink-900 to-ink-700 flex items-center justify-center shadow-lg shadow-ink-900/20 group-hover:shadow-ink-900/40 transition">
            <span class="font-display font-bold text-gold-400 text-lg leading-none">G</span>
          </div>
          <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-md bg-gold-500 flex items-center justify-center shadow">
            <span class="font-display font-bold text-ink-950 text-[9px] leading-none">SC</span>
          </span>
        </div>
        <div class="leading-tight hidden sm:block">
          <p class="font-display font-bold text-ink-900 text-lg tracking-tight">GSC <span class="text-gold-500">Sarl</span></p>
          <p class="text-[10px] uppercase tracking-[0.18em] text-ink-500 font-semibold">Générale de Service Continental</p>
        </div>
      </a>

      <!-- Desktop nav -->
      <ul class="hidden lg:flex items-center gap-1">
        <li><a [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">home      <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
        <li><a [routerLink]="['/home']" fragment="about" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">À Propos     <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
        <li><a [routerLink]="['/home']" fragment="services" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">Services     <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
        <li><a [routerLink]="['/home']" fragment="realisations" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">Réalisations <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
        <li><a [routerLink]="['/home']" fragment="vision" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">Vision       <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
        <li><a [routerLink]="['/home']" fragment="contact" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="px-4 py-2 text-sm font-semibold text-ink-900 hover:text-gold-600 relative group transition">Contact      <span class="absolute left-4 right-4 -bottom-0.5 h-0.5 bg-gold-500 scale-x-0 group-hover:scale-x-100 origin-left transition-transform"></span></a></li>
      </ul>

      <!-- CTA -->
      <div class="hidden lg:flex items-center gap-3">
        <a href="tel:+243998145840" class="text-sm font-semibold text-ink-900 hover:text-gold-600 transition flex items-center gap-2">
          <svg class="w-4 h-4 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.28a2 2 0 011.94 1.515l.7 2.828a2 2 0 01-.45 1.95L8.09 10.91a11 11 0 005 5l1.617-1.38a2 2 0 011.95-.45l2.828.7A2 2 0 0121 16.72V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          +243 998 145 840
        </a>
        <a href="#contact" class="group relative inline-flex items-center gap-2 bg-ink-900 hover:bg-ink-800 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-lg shadow-ink-900/20 hover:shadow-ink-900/40 transition overflow-hidden">
          <span class="relative z-10">Devis gratuit</span>
          <svg class="relative z-10 w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          <span class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 bg-gradient-to-r from-transparent via-gold-500/30 to-transparent"></span>
        </a>
      </div>

      <!-- Mobile burger (CSS-only) -->
      <label for="nav-toggle" class="lg:hidden cursor-pointer w-10 h-10 flex flex-col items-center justify-center gap-1.5 group">
        <span class="bar-1 block w-6 h-0.5 bg-ink-900 rounded transition-all duration-300"></span>
        <span class="bar-2 block w-6 h-0.5 bg-ink-900 rounded transition-all duration-300"></span>
        <span class="bar-3 block w-6 h-0.5 bg-ink-900 rounded transition-all duration-300"></span>
      </label>
    </nav>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="lg:hidden max-h-0 opacity-0 pointer-events-none overflow-hidden transition-all duration-500 ease-out bg-white border-t border-ink-100">
      <ul class="px-6 py-6 flex flex-col gap-1">
        <li><a [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">home</a></li>
        <li><a [routerLink]="['/home']" fragment="about" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">À Propos</a></li>
        <li><a [routerLink]="['/home']" fragment="services" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">Services</a></li>
        <li><a [routerLink]="['/home']" fragment="realisations" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">Réalisations</a></li>
        <li><a [routerLink]="['/home']" fragment="vision" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">Vision &amp; Mission</a></li>
        <li><a [routerLink]="['/home']" fragment="contact" routerLinkActive="active" [routerLinkActiveOptions]="{ fragment: 'exact' }" class="block py-3 px-4 rounded-lg text-ink-900 font-semibold hover:bg-gold-50 hover:text-gold-700 transition">Contact</a></li>
        <li class="pt-3"><a [routerLink]="['/home']" fragment="contact" class="block text-center bg-ink-900 text-white font-semibold py-3 px-4 rounded-xl hover:bg-ink-800 transition">Demander un devis →</a></li>
      </ul>
    </div>
  </header>
