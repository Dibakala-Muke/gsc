<section id="contact" class="py-24 lg:py-32 bg-white">
  <div appScroll>
    <div class="max-w-7xl mx-auto px-6">
      <div class="grid gap-10 lg:grid-cols-[1.1fr_0.9fr] items-center">
        <div appGsapSlide="left" class="relative overflow-hidden rounded-[2rem] shadow-2xl border border-slate-200">
          <img src="/images/contact.jpg" alt="Business meeting" class="w-full max-h-[650px] object-cover" />
          <div class="absolute inset-0 bg-gradient-to-tr from-ink-900/20 via-transparent to-ink-900/10"></div>
        </div>

        <div appGsapSlide="right" class="bg-white p-10">
          <h2 class="mt-2 font-display text-4xl font-bold text-ink-900 tracking-tight">
            Rejoignez GSC et transformez votre projet.
          </h2>
          <form class="mt-10 space-y-6" autocomplete="off">
            <div class="grid gap-6 sm:grid-cols-2">
              <label class="block">
                <span class="text-sm font-semibold text-ink-900">Prénom*</span>
                <input type="text" placeholder="Votre prénom" class="mt-3 w-full rounded-3xl border border-slate-300 bg-white px-5 py-4 text-base text-ink-900 outline-none transition focus:border-ink-700 focus:ring-4 focus:ring-ink-700/10" />
              </label>
              <label class="block">
                <span class="text-sm font-semibold text-ink-900">Nom*</span>
                <input type="text" placeholder="Votre nom" class="mt-3 w-full rounded-3xl border border-slate-300 bg-white px-5 py-4 text-base text-ink-900 outline-none transition focus:border-ink-700 focus:ring-4 focus:ring-ink-700/10" />
              </label>
            </div>

            <label class="block">
              <span class="text-sm font-semibold text-ink-900">Email*</span>
              <input type="email" placeholder="Votre adresse email" class="mt-3 w-full rounded-3xl border border-slate-300 bg-white px-5 py-4 text-base text-ink-900 outline-none transition focus:border-ink-700 focus:ring-4 focus:ring-ink-700/10" />
            </label>

            <label class="block">
              <span class="text-sm font-semibold text-ink-900">Message*</span>
              <textarea rows="5" placeholder="Entrez votre message" class="mt-3 w-full rounded-3xl border border-slate-300 bg-white px-5 py-4 text-base text-ink-900 outline-none transition focus:border-ink-700 focus:ring-4 focus:ring-ink-700/10"></textarea>
            </label>

            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
              <button type="submit" class="inline-flex items-center justify-center rounded-full bg-ink-700 px-8 py-4 text-white text-base font-bold transition hover:bg-ink-800 focus:outline-none focus:ring-4 focus:ring-ink-700/20">
                Envoyer
              </button>
              <p class="text-sm text-ink-700/70">Nous répondons sous 24h ouvrées.</p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
