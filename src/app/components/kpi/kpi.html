<section #kpiSection id="kpi" class="py-5 lg:py-32 bg-white">
    <div
        class="mx-auto grid max-w-7xl gap-12 lg:grid-cols-[minmax(0,1fr)_minmax(440px,0.85fr)] items-center px-6 sm:px-8 lg:px-0">
        <div class="relative overflow-hidden bg-white p-8 sm:p-10 lg:p-14">
            <div appGsapSlide="right" class="relative">
                <div class="absolute inset-0 from-gold-500/10 via-transparent to-ink-900/5"></div>
                <div class="relative space-y-10">
                    <div class="max-w-2xl">
                        <span
                            class="inline-flex items-center gap-2 rounded-full border border-gold-500/25 bg-gold-500/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-gold-700">
                            Chiffres clés
                        </span>
                        <p class="mt-6 max-w-xl text-base leading-8 text-ink-700 sm:text-lg">
                            Nous offrons des formations innovantes pour un avenir meilleur, avec un accompagnement fort,
                            des
                            événements structurants et des partenariats durables.
                        </p>
                    </div>

                    <!-- Grille des KPIs gérée par le Signal -->
                    <div class="grid gap-4 sm:grid-cols-3">
                        @for (kpi of kpis(); track kpi.label) {
                        <div class="rounded-[2rem] border border-ink-100 bg-ink-50 p-6 text-center shadow-sm">
                            <p class="text-4xl font-black tracking-tight text-ink-900">
                                {{ kpi.current }}{{ kpi.suffix }}
                            </p>
                            <p class="mt-3 text-sm font-semibold uppercase tracking-[0.22em] text-ink-700">
                                {{ kpi.label }}
                            </p>
                        </div>
                        }
                    </div>

                    <div>
                        <a href="#services"
                            class="inline-flex items-center justify-center rounded-full bg-gold-600 px-8 py-4 text-sm font-semibold text-white shadow-xl shadow-gold-500/20 transition hover:bg-gold-700">
                            Découvrez nos actions
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="relative">
            <div appGsapSlide="left">
                <div class="pointer-events-none absolute -inset-4 bg-gold-500/10 blur-3xl"></div>
                <div class="relative overflow-hidden rounded-[2.5rem] bg-white">
                    <img src="/images/fond3.jpg" alt="Vue aérienne de la ville"
                        class="h-[420px] w-full object-cover sm:h-[520px]" />
                </div>
            </div>
        </div>
    </div>
</section>
